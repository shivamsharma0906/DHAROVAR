backend:
  name: github
  repo: shivamsharma0906/DHAROVAR
  branch: main
  auth_endpoint: api/auth

# Local backend support for testing without live Git Gateway
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "publications"
    label: "Publications & Insights"
    folder: "src/content/publications"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { 
          label: "Category", 
          name: "category", 
          widget: "select", 
          options: ["Domestic Policy & Governance", "External Relations", "Geopolitics & Multipolar Order"] 
        }
      - { label: "Author / Division", name: "author", widget: "string", required: false }
      - { label: "Cover Image", name: "cover_image", widget: "image", required: false }
      - { 
          label: "Video File Upload (.mp4 / .webm)", 
          name: "video_file", 
          widget: "file", 
          required: false, 
          hint: "Upload MP4 or WebM video file directly from computer" 
        }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body Content", name: "body", widget: "markdown" }

  - name: "welfare"
    label: "Welfare Initiatives"
    folder: "src/content/welfare"
    create: true
    delete: true
    slug: "{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Partner School Name", name: "school_name", widget: "string" }
      - { label: "Project Title", name: "project_title", widget: "string" }
      - { label: "Impact Metric Badge", name: "impact_metrics", widget: "string" }
      - { label: "Cover Photo", name: "cover_image", widget: "image", required: false }
      - { 
          label: "Seminar & Event Photo Gallery", 
          name: "event_photos", 
          widget: "list", 
          required: false,
          field: { label: "Photo", name: "photo", widget: "image" } 
        }
      - { label: "Full Description", name: "description", widget: "markdown" }
